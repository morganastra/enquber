<!--
  enquber fallback icon: go back (from Feather Icons, see the README).

  The SVG is the source of :/enquber/icons/actions/arrow-left.png. It is a
  single black stroke on a transparent background; the application tints it
  with the current palette foreground so it works on light and dark themes.

  Regenerate the checked-in PNG with:
    rsvg-convert -w 128 -h 128 arrow-left.svg -o arrow-left.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <line x1="19" y1="12" x2="5" y2="12"/>
  <polyline points="12 19 5 12 12 5"/>
</svg>
