<!--
  enquber fallback icon: the link drop target (a chain link).

  The SVG is the source of :/enquber/icons/actions/insert-link.png. It is a
  single black stroke on a transparent background; the application tints it
  with the current palette foreground so it works on light and dark themes.

  Regenerate the checked-in PNG with:
    rsvg-convert -w 128 -h 128 insert-link.svg -o insert-link.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
</svg>
