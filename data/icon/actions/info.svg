<!--
  enquber fallback icon: information / an "i" (from Feather Icons, see the
  README).

  The SVG is the source of :/enquber/icons/actions/info.png. It is a single
  black stroke on a transparent background; the application tints it with the
  current palette foreground so it works on light and dark themes.

  Regenerate the checked-in PNG with:
    rsvg-convert -w 128 -h 128 info.svg -o info.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <line x1="12" y1="16" x2="12" y2="12"/>
  <line x1="12" y1="8" x2="12.01" y2="8"/>
</svg>
