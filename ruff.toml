# Python lint for the helper scripts under tools/ and tests/.
#
#     just lint-py          # ruff check tools tests
#     ruff check --fix tools tests
#
# The vendored Qt review linter is third-party code and is kept verbatim.
target-version = "py310"
line-length = 100
extend-exclude = ["tools/qt_review_lint.py"]

[lint]
# Kept explicit: ruff's default rule set grows between releases.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF",
          "BLE", "PLW", "TRY", "S", "EXE"]
ignore = [
    "S603", "S607",  # the smoke harness launches subprocesses on purpose
    "S108", "S314",  # temp dirs, local trusted .ts files
    "TRY003",        # We don't need custom exception classes for standalone scripts
]
